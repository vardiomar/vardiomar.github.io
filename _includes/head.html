<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.data.settings.title }}{% endif %}</title>
  <meta name='description' content='{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.data.settings.description }}{% endif %}'>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{{ page.image | absolute_url }}">

  <!-- Facebook OpenGraph -->
  <meta property="og:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta property="og:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Syne:wght@400..800&display=swap" rel="stylesheet">

  {% assign cfg_theme_default = site.data.settings.theme.default | default: 'matrix' %}
  {% assign cfg_switcher_header = site.data.settings.theme.theme_switcher %}
  <script>
    (function () {
      var VALID = ['matrix', 'dracula', 'nord', 'gruvbox', 'mono'];
      var DEFAULT = '{{ cfg_theme_default }}';
      var SWITCHER_OFF = {% if cfg_switcher_header == false %}true{% else %}false{% endif %};
      var theme = DEFAULT;

      if (!SWITCHER_OFF) {
        try {
          var saved = localStorage.getItem('hexdump-theme');
          if (saved && VALID.indexOf(saved) !== -1) theme = saved;
        } catch (e) {}
      }

      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <script>
    window.HEXDUMP = {
      // Author
      author: "{{ site.data.settings.author.username | default: 'admin' }}",
      hostname: "{{ site.data.settings.author.hostname }}",
      email: "{{ site.data.settings.author.email | default: '' }}",
      careerStart: "{{ site.data.settings.author.career_start | default: '' }}",
      projectsCompleted: {{ site.data.settings.author.projects_completed }},
      authorStatus: "{{ site.data.settings.author.status | default: 'available' }}",

      // Theme
      defaultTheme: "{{ cfg_theme_default }}",
      switcherOff: {% if cfg_switcher_header == false %} true{% else %} false{% endif %},
      themes: {{ site.data.settings.themes | map: 'name' | jsonify }},

      // Site
      siteName: "{{ site.data.settings.title }}",

      // Posts Page
      postsPerPage: {{ site.data.settings.posts_page.per_page | default: 6 }},
      searchJsonUrl: "{{ '/search.json' | relative_url }}",

      // Social
      social: {{ site.data.settings.author.social | jsonify }},

      // About
      aboutDescription: {{ site.data.settings.about.description | strip_newlines | jsonify }},
      aboutRole: {{ site.data.settings.author.role | jsonify }},
      avatar: {{ site.data.settings.author.avatar | jsonify }},
      skills: {{ site.data.settings.author.skills | jsonify }}
    };
  </script>
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
</head>
