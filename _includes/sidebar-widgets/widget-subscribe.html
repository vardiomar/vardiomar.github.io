{% if site.data.settings.subscribe.enable %}
<div class="widget widget-subscribe">
  <div class="widget__header">
    <span class="widget__title">Stay in the Loop</span>
  </div>
  <div class="widget-subscribe__content">
    {% if site.data.settings.subscribe.description %}
    <p class="widget-subscribe__description">{{ site.data.settings.subscribe.description }}</p>
    {% endif %}
  </div>
  <form class="widget-subscribe__form validate"
    action="{% if site.data.settings.subscribe.action_url %}//{{ site.data.settings.subscribe.action_url }}{% else %}#{% endif %}" method="POST" id="membedded-subscribe-form" name="membedded-subscribe-form" target="_blank" novalidate>
    <label class="screen-reader-text" for="mce-EMAIL">Email address</label>
    <input class="widget-subscribe__email required email" id="mce-EMAIL" type="email" name="EMAIL" placeholder="{{ site.data.settings.subscribe.placeholder | default: 'you@example.com' }}">
    <button class="widget-subscribe__button button button--primary button--full" id="membedded-subscribe" type="submit" name="subscribe">{{ site.data.settings.subscribe.button_text }}</button>
  </form>
</div>
{% endif %}
