Diagnosing a mismatch between the theme and its stylesheet.
Diagnosing a mismatch between the theme and its stylesheet.
Your config.yml doesn’t use Hexdump. It has remote_theme: daviddarnes/alembic@main, so your site is currently built on the Alembic theme, and that Hexdump CSS isn’t being loaded at all. Keys like navigation_header and social_links are also Alembic-specific, so Hexdump won’t read them.

Before editing any of the six files, decide which theme you want.

Option A: Stay on Alembic. Nothing needs to change in config.yml. Edit nav.html or header.html only if you want to override Alembic’s defaults, and fill in index.md, projects.md and academic.md.

Option B: Switch to Hexdump. That CSS looks like a plain static theme (.site-header, #main, #content, .site-info), so it probably ships as a folder of layouts, includes and assets rather than a gem. In that case:

Copy the Hexdump files into your repo root: _layouts/, _includes/, assets/ (including the stylesheet), and so on.
In config.yml, delete the remote_theme: line and jekyll-remote-theme from plugins. Remove navigation_header and social_links too, unless Hexdump’s templates read them (the docs will say).
Keep title, description and url, because Hexdump’s header almost certainly prints site.title and site.description. Your description is already a good tagline for the header.
Then edit header.html, nav.html, and the three .md files. Make sure their front matter uses a layout name that actually exists in Hexdump’s _layouts/ (your defaults currently set layout: page, which may not exist there).
Since you’re going to the trouble of downloading Hexdump, I’d assume Option B, and the first edit is the theme swap in config.yml.

To give you exact changes for header.html and nav.html, I need to see Hexdump’s _layouts/default.html (or whatever the main layout is) and its _includes/header.html. Paste those and I’ll tell you what to change.

