Do nav.html next. Once the menu works, you can click between pages while you fill in index.md, and you’ll find out right away if a page’s layout or permalink is wrong.

Here’s a nav.html that reads the navigation_header list from your config, so you only edit links in one place:

html
<nav class="site-nav">
  <ul>
    {% for item in site.navigation_header %}
      <li>
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}>
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
