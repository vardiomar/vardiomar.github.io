Checking access to a local file path provided.
Checking access to a local file path provided.
Start with config.yml. In Jekyll it drives everything else: site title, description, url and baseurl, theme settings, and often the author info and navigation links that the layouts read from. For a vardiomar.github.io user site, url should be https://vardiomar.github.io and baseurl should be empty (""). If those are wrong, CSS, links and images break no matter what you edit afterward. Restart jekyll serve after each config change, because _config.yml isn’t live-reloaded.

After that, I’d go in this order:

nav.html: set your menu entries so they point to your pages (Home, Academic, Projects). Doing this early lets you click between pages while you edit the rest.
header.html: set your site name or logo, and any head or meta tags the theme exposes.
index.md: your landing page, once the structure around it works.
academic.md, then projects.md: these are mostly content, so they’re easiest to fill in last. Check that each has the front matter (the --- block with layout, title, and permalink if the theme uses it) that the theme expects.
