<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>
  {% if site.data.settings.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

  {% if site.data.settings.hero.image and page.url == '/' %}
  <!-- begin hero image -->
  <div class="hero__image">
    <div class="hero__image__inner">
      <img class="lazy" data-src="{{ site.data.settings.hero.image }}" alt="{{ site.data.settings.title }}">
    </div>
  </div>
  <!-- end hero image -->
  {% endif %}

  {% include header.html %}

  <!-- begin content -->
  <main class="content" aria-label="Content">
    {{ content }}
  </main>
  <!-- end content -->

  {% include section-subscribe.html %}

  {% include footer.html %}

  <div class="images-overlay"></div>

  <script src="{{ '/js/scripts.js' | relative_url }}"></script>
  <script src="{{ '/js/common.js' | relative_url }}"></script>
</body>

</html>
